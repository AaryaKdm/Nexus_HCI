<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus — Log In</title>
<link rel="stylesheet" href="styles.css"><script>document.documentElement.setAttribute('data-theme',localStorage.getItem('nexus_theme')||'light')</script>
</head><body data-page="login"><header class="topbar"><a href="index.html" class="brand"><span class="brand-name">Nexus</span></a><div class="topbar-right"><div class="theme-switch"><button data-theme="light">☀️</button><button data-theme="dark">🌙</button><button data-theme="eye">🌗</button></div></div></header>
<main class="auth-shell"><section class="card auth-card"><div class="auth-header"><div class="big-icon">🤝</div><h1>Welcome to Nexus</h1><p>Sign in to access your career workspace.</p></div>
<div class="auth-tabs" role="tablist"><button class="auth-tab active" id="tabLogin" type="button">Log In</button><button class="auth-tab" id="tabSignup" type="button">Sign Up</button></div>
<div class="auth-panel active" id="panelLogin"><form id="loginForm">
<div class="field-group"><label for="loginEmail">Email address</label><div class="field-shell"><input type="email" id="loginEmail" required autocomplete="email"></div></div>
<div class="field-group"><label for="loginPassword">Password</label><div class="field-shell"><input type="password" id="loginPassword" required autocomplete="current-password"><button type="button" class="field-action" data-toggle="loginPassword">👁️</button></div></div>
<div class="auth-row-between"><span></span><button type="button" class="link-btn" id="forgotPwBtn">Forgot password?</button></div><button class="btn btn-primary btn-block">Log In</button></form>
<div class="auth-divider">or</div><button type="button" class="btn-alt" id="googleLoginBtn">Continue with Google</button><p class="auth-switch">New to Nexus? <button class="link-btn" id="goSignup">Create an account</button></p></div>
<div class="auth-panel" id="panelSignup"><form id="signupForm">
<div class="field-group"><label for="signupName">Full name</label><div class="field-shell"><input id="signupName" required autocomplete="name"></div></div>
<div class="field-group"><label for="signupEmail">Email address</label><div class="field-shell"><input type="email" id="signupEmail" required autocomplete="email"></div></div>
<div class="field-group"><label for="signupPassword">Password</label><div class="field-shell"><input type="password" id="signupPassword" required minlength="8" autocomplete="new-password"><button type="button" class="field-action" data-toggle="signupPassword">👁️</button></div></div>
<div class="field-group"><label for="signupConfirm">Confirm password</label><div class="field-shell"><input type="password" id="signupConfirm" required minlength="8" autocomplete="new-password"></div></div>
<button class="btn btn-primary btn-block">Create Account</button></form><div class="auth-divider">or</div><button type="button" class="btn-alt" id="googleSignupBtn">Continue with Google</button><p class="auth-switch">Already registered? <button class="link-btn" id="goLogin">Log in</button></p></div>
</section></main><div id="app-footer"></div><div class="toast" id="toast"><span id="toastMsg"></span></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
<script>
const showTab=tab=>{const login=tab==='login';tabLogin.classList.toggle('active',login);tabSignup.classList.toggle('active',!login);panelLogin.classList.toggle('active',login);panelSignup.classList.toggle('active',!login)};
tabLogin.onclick=()=>showTab('login');tabSignup.onclick=()=>showTab('signup');goSignup.onclick=()=>showTab('signup');goLogin.onclick=()=>showTab('login');
document.querySelectorAll('[data-toggle]').forEach(button=>button.onclick=()=>{const input=document.getElementById(button.dataset.toggle);input.type=input.type==='password'?'text':'password'});
loginForm.onsubmit=async event=>{event.preventDefault();const result=await signInWithEmail(loginEmail.value.trim(),loginPassword.value);if(result.error)return showToast(result.error.message);window.location.href=new URLSearchParams(location.search).get('next')||'index.html'};
signupForm.onsubmit=async event=>{event.preventDefault();if(signupPassword.value!==signupConfirm.value)return showToast('Passwords do not match.');const result=await signUpWithEmail(signupName.value.trim(),signupEmail.value.trim(),signupPassword.value);if(result.error)return showToast(result.error.message);if(!result.data.session)return showToast('Check your email to confirm your account.');window.location.href='index.html'};
googleLoginBtn.onclick=signInWithGoogle;googleSignupBtn.onclick=signInWithGoogle;
forgotPwBtn.onclick=async()=>{const email=loginEmail.value.trim();if(!email)return showToast('Enter your email address first.');const result=await requestPasswordReset(email);showToast(result.error?result.error.message:'Password reset email sent.')};
</script></body></html>
