<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus — Profile</title>
<link rel="stylesheet" href="styles.css"><script>document.documentElement.setAttribute('data-theme',localStorage.getItem('nexus_theme')||'light')</script>
</head><body data-page="profile"><div id="app-header"></div><div class="app-shell"><div id="app-nav"></div>
<main class="main-content"><div class="page-grid"><div>
<section class="card info-card" id="viewMode"><div class="profile-heading"><div class="profile-avatar-lg" id="pAvatar">NU</div><div class="profile-heading-text"><h2 id="pName">Loading…</h2><span class="tag tag-open" id="demoBadge" hidden>Demo member</span><p id="pHeadline"></p><p id="pLocation"></p></div><div id="profileActions"></div></div><p id="pBio" class="profile-text"></p><div id="profileDetails"></div></section>
<section class="card info-card" id="editMode" hidden><h3>Edit profile</h3><form id="profileForm">
<div class="form-field"><span class="form-label">Profile picture</span><div class="profile-photo-editor"><div class="profile-avatar-lg" id="fAvatarPreview">NU</div><div class="profile-photo-actions"><label class="btn btn-ghost btn-sm" for="fAvatar">Upload photo</label><input class="visually-hidden" id="fAvatar" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="fAvatarHint fAvatarName"><span id="fAvatarName">No new photo selected</span><p class="form-hint" id="fAvatarHint">JPEG, PNG, or WebP. Maximum 2 MB.</p></div></div></div>
<div class="form-field"><label for="fName">Full name</label><input id="fName" required maxlength="100"></div>
<div class="form-field"><label for="fHeadline">Headline</label><input id="fHeadline" maxlength="160" placeholder="Student, designer, developer…"></div>
<div class="form-field"><label for="fLocation">Location</label><input id="fLocation" maxlength="120" placeholder="Start typing a city or region"></div>
<div class="form-field"><label for="fBio">About</label><textarea id="fBio" maxlength="2000"></textarea></div>
<div class="form-field"><label for="fSchool">School</label><input id="fSchool" maxlength="160" placeholder="Start typing a school name"></div>
<div class="form-field"><label for="fCollege">College</label><input id="fCollege" maxlength="160" placeholder="Start typing a college name"></div>
<div class="form-field"><label for="fUniversity">University</label><input id="fUniversity" maxlength="160" placeholder="Start typing a university name"></div>
<div class="form-field"><label for="fJobHistory">Job and internship history</label><textarea id="fJobHistory" maxlength="2000" placeholder="Role, employer, dates, and what you worked on"></textarea></div>
<div class="form-field"><label for="fSkills">Skills</label><input id="fSkills" maxlength="500" placeholder="Separate skills with commas"></div>
<div class="form-field"><label for="fProject">Portfolio URL</label><input id="fProject" type="url"></div>
<div class="form-field"><label for="fLinkedin">LinkedIn URL</label><input id="fLinkedin" type="url"></div>
<div class="form-field"><label for="fGithub">GitHub URL</label><input id="fGithub" type="url"></div>
<div class="form-field"><label for="fInstagram">Instagram URL</label><input id="fInstagram" type="url"></div>
<div class="btn-row"><button class="btn btn-primary">Save changes</button><button type="button" class="btn btn-ghost" id="cancelEditBtn">Cancel</button></div></form></section>
<section class="card info-card" id="ownActivity"><h3>My activity</h3><div class="stat-row"><a class="stat-pill" href="applications.html"><strong id="statApplied">0</strong><span>Applications</span></a><a class="stat-pill" href="applications.html?tab=saved"><strong id="statSaved">0</strong><span>Saved roles</span></a><a class="stat-pill" href="network.html"><strong id="statConnections">0</strong><span>Connections</span></a></div></section>
<section class="card info-card"><h3>Posts</h3><div id="profilePosts">Loading posts…</div></section></div>
<aside><section class="card rail-card" id="ownStrength"><h4>Profile strength</h4><div class="progress-track"><div id="profileProgress"></div></div><p id="profileCompletion">0% complete</p></section>
<section class="card rail-card" id="ownAccount"><h4>Account</h4><button class="btn btn-ghost btn-block" onclick="signOutUser()">Log out</button></section></aside></div></main></div>
<div id="app-footer"></div><div class="toast" id="toast"><span id="toastMsg"></span></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script src="pages.js"></script>
</body></html>
